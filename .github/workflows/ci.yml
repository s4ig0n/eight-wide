name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIMD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test native kernels
        run: ctest --test-dir build --output-on-failure
      - name: Test cache simulator
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
